# Builds the worker image (the root Dockerfile's `worker` target) — Cloud Run's
# repo integration can't select a Docker target, so the worker service builds
# through this config instead:
#   gcloud builds submit --config cloudbuild.worker.yaml --project myeventerimporter .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--target", "worker", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
substitutions:
  _IMAGE: europe-west1-docker.pkg.dev/myeventerimporter/cloud-run-source-deploy/awm-monitoring-worker:latest
options:
  logging: CLOUD_LOGGING_ONLY
